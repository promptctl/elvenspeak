name: smoke-image
description: >-
  Runs an image this job built into the runner's Docker store, and fails unless it answers
  /health, passes its own HEALTHCHECK and answers every question speaks.py asks.

# ONE BOOT TABLE, for every job that proves an image. Two jobs smoke images: `prove` on
# every ref, and `publish` in front of its push. What an engine needs before it can answer
# at all is a fact about the engine, not about which job is asking, so it is written once
# here. Copied into both jobs, the day an engine gains a setting with no default one copy
# gains it and the other goes red for a reason that says nothing about the commit, which
# is gitea run 38 again. [LAW:one-source-of-truth]
#
# THE IMAGE MUST BE LOCALLY PRESENT, and nothing about the invocation says so out loud.
# `smoke.py` reads the port to poll and the HEALTHCHECK to run out of `docker image
# inspect`, which resolves the local store and never the registry. Both callers satisfy
# that by building on this runner's daemon in the step before. Two edits would break it,
# and both fail here at the first call rather than anywhere that explains itself: passing
# a registry reference that nothing pulled, or building with `--push` instead of `--load`.
#
# `--runtime docker` rather than smoke.py's first-installed default, for the same reason:
# the image exists in that daemon's store and nowhere else, so a podman arriving on this
# runner would otherwise move the smoke to a runtime that cannot see what was built.
#
# UNCONFINED, DECIDED RATHER THAN DEFAULTED. Passing `--memory` obliges
# `--env ELVENSPEAK_CONCURRENT_SYNTHESES=N`, since the image refuses to start under a
# ceiling nobody chose, and N is a per-engine runtime figure nobody has measured.
# Chatterbox's 4.69 GiB is its *bake* peak, which is a different number for a different
# phase, and reusing it here would be a guess wearing a measurement's clothes. A ceiling
# guessed low turns a leg red for a reason that has nothing to do with the commit that hit
# it. Confined is the shape the fleet actually runs and is worth proving against measured
# numbers, and there are none yet: that is piper-build-b4h.scw, and this file is the one
# place it will need to change.
#
# ONE KNOWN FLAKE, WRITTEN DOWN SO NOBODY HUNTS A PHANTOM. `smoke.py` picks its host port
# by binding :0, reading the number and closing, so there is a small bounded window before
# the runtime binds it. This scheduler starts a job's matrix legs in the same second, so
# legs genuinely can race for a port. A leg that goes red on a bind error is this, and a
# re-run clears it; it is not a broken image. It was left unfixed deliberately: holding the
# socket open would stop the runtime binding at all, and the race-free form (publish to an
# ephemeral port and ask the runtime which it got) does not exist on every runtime
# `smoke.py` supports. See piper-build-b4h.1's review for the evidence.
# [LAW:no-ambient-temporal-coupling]
#
# No `--timeout`: 180s is `smoke.py`'s own default, chosen as the slowest engine's model
# load. Restating it here would be a second copy of a number that belongs to the script.
# [LAW:one-source-of-truth]

inputs:
  image:
    description: The reference to run, exactly as this runner's Docker daemon resolves it.
    required: true
  engine:
    description: >-
      The engine the image carries, which decides what it must be given before it can
      answer at all.
    required: true

runs:
  using: composite
  steps:
    - name: Run the image and ask it everything smoke.py asks
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        ENGINE: ${{ inputs.engine }}
      run: |
        set -euo pipefail

        # WHAT EACH ENGINE NEEDS BEFORE IT CAN ANSWER AT ALL, as one table.
        #
        # The first run of the smoke gave every engine an empty environment, and two legs
        # went red for it on gitea run 38: not broken images, but settings with no
        # default, which is a red that says nothing about the commit. Each printed its own
        # refusal from inside its own container.
        #
        # A table and not a branch: every engine runs the same command below and only
        # these values differ. Every engine that needs anything is named, so the `*)` arm
        # means "needs nothing" rather than "not looked into".
        # [LAW:dataflow-not-control-flow]
        case "$ENGINE" in
          # `cpu` because this runner has no accelerator. `speaks.conform` does
          # synthesize here, at the 8-33x real time that makes cpu the wrong choice for
          # a deployment, and `speaks.budget` is sized for exactly that.
          chatterbox) boot=(--env CHATTERBOX_DEVICE=cpu) ;;

          # The router synthesizes nothing, so what it needs is not a setting but
          # something to discover. `--fleet` runs `fleetstub.py` in a second container,
          # started from the image being smoked so nothing is built or pulled, and points
          # ROUTER_CONSUL_URL at it.
          #
          # An env var alone was tried first and is not enough, which is the whole of
          # piper-build-b4h.4: a fleet with nothing in it is not refused
          # (`elvenspeak/router.py`), so a reachable but empty stub gets a router that
          # boots correctly, has no voices, and answers /health 503 by design while
          # `smoke.py` waits for a 200, trading run 38's 43-second config error for a
          # 180-second timeout that reads like a hang. Since piper-routing-7e2.17 the
          # backend must also answer /v1/models, because the router asks each one which
          # models its voices speak while it is still constructing itself.
          router)     boot=(--fleet) ;;

          *)          boot=() ;;
        esac

        python3 smoke.py "$IMAGE" --runtime docker "${boot[@]}"
