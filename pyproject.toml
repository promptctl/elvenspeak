[project]
name = "elvenspeak"
version = "1.0.0"
description = "Serves the ElevenLabs text-to-speech API from a local engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    # The `alignment` extra pulls in `onnx`, which patches a voice model at load
    # time to expose per-phoneme durations. Without it the /with-timestamps
    # endpoints have nothing real to report, so it is a dependency rather than
    # an option — see elvenspeak/alignment.py.
    "piper-tts[alignment]>=1.7.0",
    "uvicorn[standard]>=0.52.4",
]

# ffmpeg is a required runtime dependency and cannot be declared here: it is an
# executable, not a Python package. It replaced `lame`, which could only encode
# MP3 and so made the whole service single-format. See elvenspeak/formats.py,
# and the Dockerfile, which installs it.

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elvenspeak"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
