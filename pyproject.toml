[project]
name = "elvenspeak"
version = "1.0.0"
description = "Serves the ElevenLabs text-to-speech API from a local engine"
# 3.13 is not a preference: `chatterbox-tts` pins `numpy<2` below it while
# `kokoro-onnx` needs `numpy>=2.0.2`, and one lockfile has to satisfy every extra
# at once, so this is the lowest floor on which all four engines resolve together.
requires-python = ">=3.13"
# Everything the ElevenLabs surface itself needs, and nothing an engine needs.
# [LAW:one-source-of-truth] `tests/test_encoding.py` proves statically that the
# reusable half of this package cannot reach an engine library; this list is the
# same claim written where an installer can read it, and the two have to agree.
# A project that brings its own engine installs `elvenspeak` and gets the API
# surface — not two ONNX runtimes, a phonemizer and an espeak wheel it will never
# call, whose pins are also free to conflict with the ones its own engine needs.
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

# ffmpeg is a required runtime dependency and cannot be declared here: it is an
# executable, not a Python package. It replaced `lame`, which could only encode
# MP3 and so made the whole service single-format. See elvenspeak/formats.py,
# and the Dockerfile, which installs it.

# [LAW:one-source-of-truth] Each engine's extra is named after the key that
# selects that engine in `elvenspeak.engines.ENGINES`, so `ELVENSPEAK_ENGINE=x`
# and `pip install elvenspeak[x]` are one word rather than two that can drift.
# `tests/test_packaging.py` holds them together; the Dockerfile installs the
# extra by interpolating the engine it was built for.
#
# Listing an engine here rather than above costs the registry nothing, because
# neither engine module imports its library at module scope — `elvenspeak.engines`
# is importable with both extras absent. An engine whose library is missing fails
# when it is asked to `acquire` or `open`, which is the same boot-time refusal it
# already gives for a missing model or a missing espeak-ng, and it reaches only
# the deployment that selected it.
[project.optional-dependencies]
# The `alignment` extra pulls in `onnx`, which patches a voice model at load time
# to expose per-phoneme durations. Without it Piper declares no TIMESTAMPS and
# the /with-timestamps endpoints refuse — see elvenspeak/alignment.py.
piper = ["piper-tts[alignment]>=1.7.0"]
# Pulls onnxruntime, numpy and phonemizer. Also needs espeak-ng, which is a
# native library no Python metadata can install; see the README.
kokoro = ["kokoro-onnx>=0.6.1"]
# `setuptools<81` is not incidental and must not be tidied away. `chatterbox-tts`
# reaches its watermarker through `perth`, whose `__init__` does
# `try: from ...perth_watermarker import PerthImplicitWatermarker` /
# `except ImportError: PerthImplicitWatermarker = None`. The import really fails
# on `from pkg_resources import resource_filename`, which setuptools removed in
# 81 — so on a current setuptools the name silently becomes None and the model
# constructor dies forty lines away with `TypeError: 'NoneType' object is not
# callable`, naming nothing. [LAW:no-silent-failure], upstream, where it can only
# be pinned around.
#
# `torch` and `torchaudio` are named without a version, which is deliberate: the
# version stays `chatterbox-tts`'s to choose, and naming them here only makes
# them direct dependencies, which is what `[tool.uv.sources]` at the foot of this
# file needs in order to route them off PyPI's CUDA build on linux. See there for
# why. Dropping either name silently restores ~3 GiB of unreachable nvidia
# wheels, so the pair is load-bearing and `tests/test_chatterbox.py` holds it.
chatterbox = ["chatterbox-tts>=0.1.7", "setuptools<81", "torch", "torchaudio"]
# Empty, and true rather than a placeholder: the router's backends are other
# elvenspeak servers, reached over HTTP with `urllib` from the standard library,
# so it needs nothing beyond `fastapi` and `uvicorn` above. `pip install
# elvenspeak[router]` therefore installs exactly what a router deployment runs —
# which is the same statement every other extra here makes.
router = []
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elvenspeak"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# The chatterbox extra is the only thing here that pulls torch, and on linux the
# default PyPI wheel declares thirteen `nvidia-*-cu12` runtime packages plus
# `triton` — around 3 GiB installed, none of it reachable: `CHATTERBOX_DEVICE`
# has no default and every deployment and every build sets it to `cpu`. The
# builder these images are published from has 7.9 GB of disk in total, so this
# is not tidiness.
#
# `explicit = true` keeps the index off every other package: it is consulted only
# for the two named below, so nothing else in the lock can silently start
# resolving from a host that is not PyPI. macOS is left on PyPI because its
# wheels carry no CUDA to begin with, and adding a second source for an identical
# artifact would only be a second thing to keep true.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
